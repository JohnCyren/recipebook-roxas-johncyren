<html>
    <body>
        <h1>Recipe Book</h1>
        {% if user.is_authenticated %}
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% elif request.path != '/login/' %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}

        <h2>{% block page_title %}{% endblock %}</h2>

        {% block content %}
        {% endblock %}
    </body>
</html>
