{% extends "base.html" %}

{% block page_title %}
    Recipes
{% endblock %}

{% block content %}

{% if user.is_authenticated %}
    <p>
        <a href="{% url 'recipe_add' %}">Add Recipe</a>
    </p>
{% endif %}

<ul>
    {% for recipe in recipes %}
        <li>
            <a href="{{ recipe.get_absolute_url }}">
                {{ recipe.name }}
            </a>
        </li>
    {% endfor %}
</ul>

{% endblock %}
