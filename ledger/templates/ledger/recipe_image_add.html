{% extends "base.html" %}

{% block page_title %}
    Add Recipe Image
{% endblock %}

{% block content %}

<h2>Add Image for {{ recipe.name }}</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload Image</button>
</form>

<p><a href="{{ recipe.get_absolute_url }}">Back to Recipe</a></p>

{% endblock %}
